<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080c14;
      --card-dark: #0f172a;
      --card-hover: #1e293b;
      --gold: #d4af37;
      --gold-light: #f6e05e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --border-gold: rgba(212, 175, 55, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--gold);
      font-weight: 800;
    }

    .badge-pro {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .layout-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      min-height: calc(100vh - 75px);
    }

    /* BARRA LATERAL (SECCIONES) */
    .sidebar {
      background-color: var(--card-dark);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      overflow-y: auto;
      max-height: calc(100vh - 75px);
    }

    .sidebar-heading {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin-bottom: 16px;
      padding-left: 12px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .nav-btn:hover {
      background-color: var(--card-hover);
      color: var(--text-main);
    }

    .nav-btn.active {
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.15), rgba(15, 23, 42, 0.4));
      border-color: var(--border-gold);
      color: var(--gold);
    }

    .nav-count {
      font-size: 0.75rem;
      background-color: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* REPRODUCTOR Y CONTENIDO */
    .content-area {
      padding: 32px 40px;
      overflow-y: auto;
      max-height: calc(100vh - 75px);
    }

    .module-header {
      margin-bottom: 24px;
    }

    .module-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .module-title span {
      color: var(--gold);
    }

    .module-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-gold);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      aspect-ratio: 16 / 9;
      margin-bottom: 28px;
    }

    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* LISTA DE VIDEOS */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .video-card {
      background-color: var(--card-dark);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .video-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .video-card.active {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.08), rgba(15, 23, 42, 0.9));
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .play-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 6px;
    }

    @media (max-width: 1024px) {
      .layout-container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        max-height: none;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
      .content-area {
        max-height: none;
        padding: 24px 20px;
      }
    }
  </style>
</head>

    const navListEl = document.getElementById("nav-list");
    const moduleTitleEl = document.getElementById("module-title");
    const moduleDescEl = document.getElementById("module-desc");
    const videoGridEl = document.getElementById("video-grid");
    const videoFrameEl = document.getElementById("video-frame");

    let currentModuleIndex = 0;
    let currentVideoIndex = 0;

    function renderNav() {
      navListEl.innerHTML = "";
      tutorialesData.forEach((mod, idx) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = `nav-btn ${idx === currentModuleIndex ? 'active' : ''}`;
        a.href = `#${mod.idModulo}`;
        a.innerHTML = `
          <span>${mod.nombreModulo}</span>
          <span class="nav-count">${mod.videos.length}</span>
        `;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          history.pushState(null, null, `#${mod.idModulo}`);
          loadModule(idx, 0);
        });
        li.appendChild(a);
        navListEl.appendChild(li);
      });
    }

    function loadModule(modIdx, vidIdx = 0) {
      currentModuleIndex = modIdx;
      currentVideoIndex = vidIdx;
      const mod = tutorialesData[modIdx];

      moduleTitleEl.innerHTML = `<span>${mod.nombreModulo}</span>`;
      moduleDescEl.textContent = mod.descripcion;

      renderNav();
      renderVideos(mod);
      playVideo(mod.videos[vidIdx].idDrive);
    }

    function renderVideos(mod) {
      videoGridEl.innerHTML = "";
      mod.videos.forEach((vid, vIdx) => {
        const card = document.createElement("div");
        card.className = `video-card ${vIdx === currentVideoIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="play-icon">▶</div>
              <div class="card-title">${vid.titulo}</div>
            </div>
            <div class="card-desc">${vid.descripcion}</div>
          </div>
        `;
        card.addEventListener("click", () => {
          currentVideoIndex = vIdx;
          renderVideos(mod);
          playVideo(vid.idDrive);
        });
        videoGridEl.appendChild(card);
      });
    }

    function playVideo(idDrive) {
      videoFrameEl.src = `https://drive.google.com/file/d/${idDrive}/preview`;
    }

    function checkHashRoute() {
      const hash = window.location.hash.replace("#", "");
      if (hash) {
        const foundIndex = tutorialesData.findIndex(m => m.idModulo === hash);
        if (foundIndex !== -1) {
          loadModule(foundIndex, 0);
          return;
        }
      }
      loadModule(0, 0);
    }

    window.addEventListener("hashchange", checkHashRoute);
    window.addEventListener("DOMContentLoaded", checkHashRoute);
  </script>
</body>
</html>
